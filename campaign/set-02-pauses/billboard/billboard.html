<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRACE — Pauses, Digital Billboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --white:#f6f7f8; --ink:#0b0e12; --platinum:#9aa1a8; --blue:#0c61da; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#e8eaec; font-family:"Inter",sans-serif; display:grid; place-items:center; min-height:100vh; padding:2rem; }
    .board {
      container-type:inline-size; width:100%; max-width:1100px; aspect-ratio:16/9;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.013) 0 2px, transparent 2px 6px),
        var(--ink);
      color:var(--white); padding:7cqw;
      display:flex; flex-direction:column; justify-content:space-between;
      box-shadow:0 30px 70px -30px rgba(11,14,18,.5);
    }
    .top,.bottom { display:flex; justify-content:space-between; align-items:flex-end; }
    .kicker { font-family:"Oswald",sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:.26em; color:var(--platinum); font-size:1.3cqw; }
    .line { font-weight:200; letter-spacing:-.035em; line-height:1.04; font-size:6.4cqw; }
    .dot { color:var(--blue); }
    .pause { display:block; width:100%; margin:2.5cqw 0 0; }
    .pause path { fill:none; stroke:var(--blue); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .pause .flat { stroke:var(--platinum); }
    .lock { display:flex; align-items:center; gap:1.6cqw; }
    .lock svg { width:3cqw; height:3cqw; }
    .lock span { font-weight:300; letter-spacing:.32em; font-size:2cqw; }
    .lock sup { font-size:.42em; color:var(--platinum); margin-left:-.28em; vertical-align:.95em; }

    @page { size: 508mm 285.75mm; margin: 0; }
    @media print {
      *, *::before, *::after { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      body { background:none; padding:0; display:block; min-height:0; }
      .board { max-width:none; box-shadow:none; aspect-ratio:16/8.94; background:var(--ink) !important; }
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="top">
      <span class="kicker">TRACE&#8482;</span>
      <span class="kicker">Wellbeing, understood</span>
    </div>
    <div>
      <p class="line">Even your pauses say something<span class="dot">.</span></p>
      <svg class="pause" viewBox="0 0 900 40" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 20 h40 l6 -13 l8 26 l6 -13 h44 l6 -10 l8 20 l6 -10 h40"/>
        <path class="flat" d="M164 20 H612"/>
        <path d="M612 20 h40 l6 -13 l8 26 l6 -13 h44 l6 -10 l8 20 l6 -10 h164"/>
      </svg>
    </div>
    <div class="bottom">
      <div class="lock">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="10" y="36" width="11" height="28" rx="5.5" fill="#f6f7f8"/><rect x="28" y="26" width="11" height="48" rx="5.5" fill="#f6f7f8"/>
          <rect x="46" y="14" width="11" height="72" rx="5.5" fill="#0c61da"/><rect x="64" y="26" width="11" height="48" rx="5.5" fill="#f6f7f8"/>
          <rect x="82" y="36" width="11" height="28" rx="5.5" fill="#f6f7f8"/>
        </svg>
        <span>TRACE<sup>&#8482;</sup></span>
      </div>
      <span class="kicker">Available now</span>
    </div>
  </div>
</body>
</html>
