<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRACE — Pauses, Primary Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --white:#f6f7f8; --ink:#0b0e12; --platinum:#9aa1a8; --blue:#0c61da; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#e8eaec; font-family:"Inter",sans-serif; display:grid; place-items:center; min-height:100vh; padding:2rem; }
    .board {
      container-type:inline-size; width:100%; max-width:620px; aspect-ratio:297/420;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.013) 0 2px, transparent 2px 6px),
        var(--ink);
      color:var(--white); padding:7cqw;
      display:flex; flex-direction:column; justify-content:space-between;
      box-shadow:0 30px 70px -30px rgba(11,14,18,.5);
    }
    .top,.bottom { display:flex; justify-content:space-between; align-items:flex-end; }
    .kicker { font-family:"Oswald",sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:.26em; color:var(--platinum); font-size:2.1cqw; }
    .line { font-weight:200; letter-spacing:-.035em; line-height:1.04; font-size:11.6cqw; }
    .dot { color:var(--blue); }
    .pause { display:block; width:100%; margin:4cqw 0; }
    .pause path { fill:none; stroke:var(--blue); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .pause .flat { stroke:var(--platinum); }
    .support { font-weight:300; color:var(--platinum); font-size:2.9cqw; line-height:1.6; max-width:74%; }
    .lock { display:flex; align-items:center; gap:1.6cqw; }
    .lock svg { width:5cqw; height:5cqw; }
    .lock span { font-weight:300; letter-spacing:.32em; font-size:3.3cqw; }
    .lock sup { font-size:.42em; color:var(--platinum); margin-left:-.28em; vertical-align:.95em; }

    @page { size: A3 portrait; margin: 0; }
    @media print {
      *, *::before, *::after { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      body { background:none; padding:0; display:block; min-height:0; }
      .board { max-width:none; box-shadow:none; aspect-ratio:297/416; background:var(--ink) !important; }
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="top">
      <span class="kicker">Wellbeing, understood</span>
      <span class="kicker">TRACE&#8482;</span>
    </div>
    <div>
      <p class="line">Even your<br>pauses<br>say something<span class="dot">.</span></p>
      <svg class="pause" viewBox="0 0 600 54" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 27 h26 l7 -17 l9 34 l7 -17 h30 l7 -13 l9 26 l7 -13 h32"/>
        <path class="flat" d="M134 27 H386"/>
        <path d="M386 27 h26 l7 -17 l9 34 l7 -17 h30 l7 -13 l9 26 l7 -13 h62"/>
      </svg>
      <p class="support">The sensor does not stop when you do. Your stillness, your hesitation and your silence are recorded with the same care as your effort.</p>
    </div>
    <div class="bottom">
      <div class="lock">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="10" y="36" width="11" height="28" rx="5.5" fill="#f6f7f8"/><rect x="28" y="26" width="11" height="48" rx="5.5" fill="#f6f7f8"/>
          <rect x="46" y="14" width="11" height="72" rx="5.5" fill="#0c61da"/><rect x="64" y="26" width="11" height="48" rx="5.5" fill="#f6f7f8"/>
          <rect x="82" y="36" width="11" height="28" rx="5.5" fill="#f6f7f8"/>
        </svg>
        <span>TRACE<sup>&#8482;</sup></span>
      </div>
    </div>
  </div>
</body>
</html>
