<!--
  TRACE — primary lockup, full colour, PRINT MASTER (type outlined)

  Artwork size: 100 mm wide at 1:1. Scales without loss.

  NO FONTS ARE REQUIRED BY THIS FILE.
  The wordmark has been converted from Inter Light 300 into vector outlines,
  so it reproduces identically on any machine, including a press that does not
  have Inter installed. Nothing needs to be done to it before printing.

  Colour targets for press (SVG itself is an RGB format, so assign these
  values in your layout application):
    Carbon   #0B0E12  =  C60 M40 Y40 K100 (rich black)  |  1 colour: K100
    Olympian #0C61DA  =  C90 M60 Y0  K0
    Platinum #9AA1A8  =  C8  M4  Y0  K34   (trademark symbol only)

  Olympian sits near the edge of the CMYK gamut and will print slightly duller
  than it appears on screen. For critical work run it as a spot colour and
  match to a physical swatch.
-->
