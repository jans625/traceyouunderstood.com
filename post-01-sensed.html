<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRACE — IG 4:5 — Everything sensed</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --white:#f6f7f8; --ink:#0b0e12; --platinum:#9aa1a8; --blue:#0c61da; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#e8eaec}
  .board{
    width:1080px;height:1350px;background:var(--ink);color:var(--white);
    padding:96px;display:flex;flex-direction:column;justify-content:space-between;
    font-family:"Inter",sans-serif;
  }
  .top,.bottom{display:flex;justify-content:space-between;align-items:flex-end}
  .kicker{font-family:"Oswald",sans-serif;font-weight:500;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:var(--platinum)}
  .line{font-weight:200;font-size:132px;line-height:1.04;letter-spacing:-.035em}
  .dot{color:var(--blue)}
  .lock{display:flex;align-items:center;gap:18px}
  .lock svg{width:56px;height:56px}
  .lock span{font-weight:300;font-size:38px;letter-spacing:.32em}
  .lock sup{font-size:.42em;color:var(--platinum);margin-left:-.28em;vertical-align:.95em}
</style>
</head>
<body>
<div class="board">
  <div class="top">
    <span class="kicker">Wellbeing, understood</span>
    <span class="kicker">TRACE&#8482;</span>
  </div>
  <p class="line">Everything<br>sensed<span class="dot">.</span><br>Nothing<br>shared<span class="dot">.</span></p>
  <div class="bottom">
    <div class="lock">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="10" y="36" width="11" height="28" rx="5.5" fill="#f6f7f8"/><rect x="28" y="26" width="11" height="48" rx="5.5" fill="#f6f7f8"/>
        <rect x="46" y="14" width="11" height="72" rx="5.5" fill="#0c61da"/><rect x="64" y="26" width="11" height="48" rx="5.5" fill="#f6f7f8"/>
        <rect x="82" y="36" width="11" height="28" rx="5.5" fill="#f6f7f8"/>
      </svg>
      <span>TRACE<sup>&#8482;</sup></span>
    </div>
  </div>
</div>
</body>
</html>
